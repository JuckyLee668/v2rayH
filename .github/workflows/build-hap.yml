name: build-hap

# Build an unsigned HAP on a GitHub-hosted Linux runner with `devecocli`.
#
# Why this works now (the previous attempt used the public OpenHarmony SDK and
# got stuck on hvigor's SDK license check):
#   - `devecocli` (npm `@deveco/deveco-cli`) is pure JS and officially supports
#     Linux when `DEVECO_CLI_CLT_PATH` points at Huawei's Command Line Tools.
#   - Command Line Tools >= 26.0.0 embeds the HarmonyOS SDK, so no separate SDK
#     download, no license synthesis, and no DevEco Studio install is needed.
#
# One-time bootstrap (the CLT zip is behind Huawei's download portal):
#   Put `commandline-tools-linux-x64-26.0.0.zip` in a release tagged `clt`, or
#   set a repository variable `CLT_ARCHIVE_URL` to a direct/download URL.
#   The workflow then runs fully automatically on tags/releases.
#
# Other inputs:
#   - `libxray_tag`: release containing `libxray.a` + `libxray.h`. If omitted,
#     the latest release is tried; if that has no assets, the kernel is built
#     from source with ohos-go (the same script as build-libxray.yml).
#
# The HAP is intentionally unsigned: the signing material is machine-specific.

on:
  workflow_dispatch:
    inputs:
      clt_archive_url:
        description: "Optional URL for commandline-tools-linux-x64-<ver>.zip (overrides CLT_ARCHIVE_URL)"
        required: false
        default: ""
      libxray_tag:
        description: "Optional release tag holding libxray.a/libxray.h (empty = latest release)"
        required: false
        default: ""
      publish:
        description: "Create/update a GitHub Release with the unsigned HAP"
        type: boolean
        required: false
        default: false
  release:
    types: [published]

permissions:
  contents: write

env:
  CLT_VERSION: "26.0.0"
  DEVECO_CLI_VERSION: "1.3.9"
  DEVECO_CLI_SKIP_VERSION_CHECK: "1"
  OHOS_GO_VERSION: "v1.27.2-ohos-beta1"

jobs:
  build-hap:
    name: unsigned HAP (HarmonyOS 6.0+)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # The `clt` release only hosts the Command Line Tools archive; don't try to
    # attach a HAP to it when that release is published.
    if: github.event_name != 'release' || github.event.release.tag_name != 'clt'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # hvigor 26.x expects JDK 21 when driven by Command Line Tools.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux native deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev unzip

      - name: Cache Command Line Tools
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/command-line-tools
          key: clt-linux-x64-${{ env.CLT_VERSION }}-v1

      - name: Download Command Line Tools
        if: steps.clt-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLT_URL: ${{ inputs.clt_archive_url || vars.CLT_ARCHIVE_URL || secrets.CLT_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/command-line-tools"
          rm -rf "$root" "$RUNNER_TEMP/clt-extract" "$RUNNER_TEMP/clt-download"
          mkdir -p "$RUNNER_TEMP/clt-extract" "$RUNNER_TEMP/clt-download"

          zip=""
          if [ -n "${CLT_URL:-}" ]; then
            echo "downloading CLT from CLT_ARCHIVE_URL"
            case "${CLT_URL%%\?*}" in
              *.tar.gz|*.tgz) out="$RUNNER_TEMP/clt.tar.gz" ;;
              *) out="$RUNNER_TEMP/clt.zip" ;;
            esac
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$out" "$CLT_URL"
            zip="$out"
          else
            echo "CLT_ARCHIVE_URL is empty; trying the 'clt' release assets"
            # Prefer split parts when present; otherwise use a single archive.
            # If the single archive is >2 GB (GitHub's per-asset limit),
            # upload it as split parts instead, e.g.:
            #   split -b 1900M -d -a 2 <clt.zip> <clt.zip>.part
            # The workflow reassembles *.part* / *.zip.NNN in name order.
            gh release download clt \
              --pattern '*.zip' \
              --pattern '*.tar.gz' \
              --pattern '*.part*' \
              --pattern '*.zip.[0-9]*' \
              --dir "$RUNNER_TEMP/clt-download" --clobber || true

            # Parts win over a single archive so that `.part00.zip` names
            # (renamed for GitHub's web uploader) are reassembled correctly.
            mapfile -t parts < <(find "$RUNNER_TEMP/clt-download" -maxdepth 1 -type f \( -name '*.part*' -o -name '*.zip.[0-9]*' \) | sort -V)
            if [ "${#parts[@]}" -gt 0 ]; then
              echo "joining ${#parts[@]} CLT archive parts"
              out="$RUNNER_TEMP/clt.zip"
              cat "${parts[@]}" > "$out"
              zip="$out"
            else
              single="$(find "$RUNNER_TEMP/clt-download" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
              zip="$single"
            fi
          fi

          if [ -z "$zip" ]; then
            echo "::error::Command Line Tools archive not found. For archives >2 GB, split them (split -b 1900M -d -a 2 <zip> <zip>.part) and upload the parts to a release tagged 'clt'; alternatively set CLT_ARCHIVE_URL to a host that accepts large files."
            exit 1
          fi

          echo "checking $(basename "$zip")"
          case "$zip" in
            *.zip) unzip -t "$zip" >/dev/null ;;
            *.tar.gz|*.tgz) tar -tzf "$zip" >/dev/null ;;
            *) echo "::error::unsupported CLT archive type: $zip"; exit 1 ;;
          esac

          echo "extracting $(basename "$zip")"
          case "$zip" in
            *.zip) unzip -q "$zip" -d "$RUNNER_TEMP/clt-extract" ;;
            *.tar.gz|*.tgz) tar -xzf "$zip" -C "$RUNNER_TEMP/clt-extract" ;;
          esac
          src="$(find "$RUNNER_TEMP/clt-extract" -maxdepth 3 -type d -name 'command-line-tools' -print -quit)"
          [ -n "$src" ] || src="$RUNNER_TEMP/clt-extract"
          mv "$src" "$root"

          test -d "$root/sdk/default/openharmony" || { echo "::error::CLT does not contain sdk/default/openharmony"; exit 1; }
          test -x "$root/tool/node/bin/node" || { echo "::error::CLT does not contain tool/node/bin/node"; exit 1; }
          test -f "$root/hvigor/bin/hvigorw.js" || { echo "::error::CLT does not contain hvigor/bin/hvigorw.js"; exit 1; }
          test -f "$root/ohpm/bin/pm-cli.js" || { echo "::error::CLT does not contain ohpm/bin/pm-cli.js"; exit 1; }
          # Some zip tools drop the executable bit; devecocli spawns these directly.
          chmod +x "$root/bin/"* 2>/dev/null || true
          chmod +x "$root/tool/node/bin/node" 2>/dev/null || true
          chmod +x "$root/hvigor/bin/"* 2>/dev/null || true
          # devecocli's CLT detection requires <root>/version.txt.
          if [ ! -f "$root/version.txt" ]; then
            printf '%s\n' "$CLT_VERSION" > "$root/version.txt"
          fi
          echo "CLT ready at $root"

      - name: Install devecocli
        shell: bash
        run: npm install -g @deveco/deveco-cli@${{ env.DEVECO_CLI_VERSION }}

      - name: Configure devecocli / verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "DEVECO_CLI_CLT_PATH=$RUNNER_TEMP/command-line-tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/command-line-tools/tool/node/bin" >> "$GITHUB_PATH"
          devecocli --version
          "$RUNNER_TEMP/command-line-tools/tool/node/bin/node" --version
          test -f "$RUNNER_TEMP/command-line-tools/sdk/default/openharmony/ets/api/@ohos.net.vpnExtension.d.ts"
          echo "HarmonyOS SDK: $(head -c 300 "$RUNNER_TEMP/command-line-tools/sdk/default/sdk-pkg.json" 2>/dev/null)"

      # libxray.a is gitignored, so a clean checkout needs it from a release
      # asset or a local build. Cache it to make repeated HAP builds fast.
      - name: Restore libxray
        id: libxray-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            entry/src/main/cpp/thirdparty/libxray/libs
            entry/src/main/cpp/thirdparty/libxray/include
          key: libxray-ohos-arm64-${{ hashFiles('native/libxray/go.mod', 'native/libxray/go.sum', 'native/libxray/*.go', 'native/build_libxray.sh', 'native/tools/**', 'native/libxray/xray-core/proxy/tun/**', 'native/libxray/gvisor/pkg/tcpip/link/fdbased/endpoint.go') }}

      - name: Setup host Go (for ccwrap when building libxray)
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Fetch or build libxray
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIBXRAY_TAG: ${{ inputs.libxray_tag || '' }}
        run: |
          set -euo pipefail
          dst="entry/src/main/cpp/thirdparty/libxray"
          mkdir -p "$dst/libs/arm64-v8a" "$dst/include" "$RUNNER_TEMP/libxray"

          args=()
          if [ -n "${LIBXRAY_TAG:-}" ]; then
            args+=("$LIBXRAY_TAG")
          fi
          if gh release download "${args[@]}" --pattern libxray.a --pattern libxray.h --dir "$RUNNER_TEMP/libxray" --clobber 2>/dev/null; then
            echo "using libxray from release ${LIBXRAY_TAG:-<latest>}"
            cp "$RUNNER_TEMP/libxray/libxray.a" "$dst/libs/arm64-v8a/libxray.a"
            cp "$RUNNER_TEMP/libxray/libxray.h" "$dst/include/libxray.h"
            exit 0
          fi

          echo "release asset unavailable; building libxray.a from source"
          osgo="$RUNNER_TEMP/ohos-go"
          asset="go${OHOS_GO_VERSION#v}-linux-amd64.tar.gz"
          url="https://github.com/sysit/ohos-go/releases/download/${OHOS_GO_VERSION}/${asset}"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$RUNNER_TEMP/ohos-go.tar.gz" "$url"
          rm -rf "$osgo"
          mkdir -p "$osgo"
          tar -xzf "$RUNNER_TEMP/ohos-go.tar.gz" -C "$osgo" --strip-components=1
          OHOS_GO="$osgo" OHOS_SDK="$RUNNER_TEMP/command-line-tools/sdk/default/openharmony" bash native/build_libxray.sh
          test -f "$dst/libs/arm64-v8a/libxray.a"
          test -f "$dst/include/libxray.h"

      - name: Save libxray
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            entry/src/main/cpp/thirdparty/libxray/libs
            entry/src/main/cpp/thirdparty/libxray/include
          key: ${{ steps.libxray-cache.outputs.cache-primary-key }}

      - name: Install ohpm dependencies
        shell: bash
        run: ohpm install --all

      - name: Build unsigned HAP
        shell: bash
        run: devecocli build --product default --build-mode release

      - name: Stage unsigned HAP
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const fs=require('fs');const s=fs.readFileSync('AppScope/app.json5','utf8');const m=s.match(/\x22versionName\x22\s*:\s*\x22([^\x22]+)\x22/);if(!m)process.exit(1);console.log(m[1])")"
          hap="$(find entry/build -type f -name '*-unsigned.hap' -print -quit)"
          [ -n "$hap" ] || { echo "::error::no unsigned HAP produced"; find entry/build -type f -name '*.hap' || true; exit 1; }
          mkdir -p dist
          out="dist/v2rayH-${version}-unsigned.hap"
          cp "$hap" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$(basename "$out")" > "dist/v2rayH-${version}.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hap=$out" >> "$GITHUB_OUTPUT"
          echo "unsigned HAP: $out ($(du -h "$out" | cut -f1))"

      - name: Upload unsigned HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayH-${{ steps.stage.outputs.version }}-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.event_name == 'release' || inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.stage.outputs.version }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="v${version}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "v2rayH ${version}" --generate-notes
          fi
          echo "published ${tag}"
